#config-version=FGVM64-7.2.5-FW-build1517-230810:opmode=0:vdom=0
#conf_file_ver=123456789
#buildno=1517
#global_vdom=1
config system global
    set admintimeout 480
    set strong-crypto disable
    set admin-ssh-port 22
    set hostname "fgt-demo"
end
config system password-policy
    set status disable
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set trusthost1 0.0.0.0 0.0.0.0
        set two-factor disable
    next
    edit "backup_admin"
        set accprofile "super_admin"
        set two-factor disable
    next
    edit "thirdsuper"
        set accprofile "super_admin"
        set trusthost1 10.0.0.0 255.255.255.0
    next
end
config system interface
    edit "wan1"
        set vdom "root"
        set role wan
        set ip 203.0.113.10 255.255.255.0
        set allowaccess ping https ssh telnet http
        set alias "Internet"
    next
    edit "internal"
        set vdom "root"
        set role lan
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping https
    next
    edit "dmz"
        set vdom "root"
        set role dmz
        set ip 10.0.0.1 255.255.255.0
    next
end
config firewall address
    edit "LAN_NET"
        set subnet 192.168.1.0 255.255.255.0
    next
    edit "DMZ_NET"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "WEB_SERVER"
        set subnet 10.0.0.50 255.255.255.255
    next
    edit "WEB_SERVER_DUP"
        set subnet 10.0.0.50 255.255.255.255
    next
    edit "UNUSED_HOST"
        set subnet 172.16.99.99 255.255.255.255
    next
    edit "PARTNER_NET"
        set subnet 198.51.100.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "WEB_GROUP"
        set member "WEB_SERVER"
    next
    edit "EMPTY_GROUP"
        set member
    next
end
config firewall service custom
    edit "TCP_8080"
        set tcp-portrange 8080
    next
end
config firewall vip
    edit "WEB_VIP"
        set extip 203.0.113.10
        set extintf "wan1"
        set portforward enable
        set protocol tcp
        set extport 443
        set mappedip 10.0.0.50
        set mappedport 443
    next
end
config firewall ssl-ssh-profile
    edit "cert-inspect"
        config https
            set status certificate-inspection
        end
        config ftps
            set status certificate-inspection
        end
    next
    edit "deep-default-ca"
        set caname "Fortinet_CA_SSL"
        config https
            set status deep-inspection
        end
    next
end
config ips sensor
    edit "ips-monitor"
        config entries
            edit 1
                set action monitor
                set status enable
            next
        end
    next
end
config antivirus profile
    edit "av-default"
        config http
            set av-scan enable
        end
    next
end
config firewall policy
    edit 1
        set name "Inbound-Web-VIP"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "WEB_VIP"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set nat enable
    next
    edit 2
        set name "Outbound-Any"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic disable
    next
    edit 3
        set name "WAN-Full-Access"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 4
        set name "Allow-Partner-SSH"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "PARTNER_NET"
        set dstaddr "DMZ_NET"
        set action accept
        set schedule "always"
        set service "SSH"
        set ssl-ssh-profile "cert-inspect"
        set ips-sensor "ips-monitor"
        set av-profile "av-default"
    next
    edit 5
        set name "Deny-Partner-SSH-shadowed"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "PARTNER_NET"
        set dstaddr "WEB_SERVER"
        set action deny
        set schedule "always"
        set service "SSH"
    next
    edit 6
        set name "Redundant-Web-A"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "LAN_NET"
        set dstaddr "WEB_SERVER"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set ssl-ssh-profile "deep-default-ca"
    next
    edit 7
        set name "Redundant-Web-B"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "LAN_NET"
        set dstaddr "WEB_SERVER"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set ssl-ssh-profile "deep-default-ca"
    next
    edit 8
        set name "Disabled-Legacy"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "LAN_NET"
        set dstaddr "DMZ_NET"
        set action accept
        set schedule "always"
        set service "ALL"
        set status disable
    next
    edit 9
        set name "DMZ-Intrazone-Traffic"
        set srcintf "DMZ_ZONE"
        set dstintf "DMZ_ZONE"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
config system zone
    edit "DMZ_ZONE"
        set intrazone allow
        set interface "dmz" "internal"
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 203.0.113.1
        set device "wan1"
    next
end
config router policy
    edit 1
        set input-device "internal"
        set src 192.168.1.0 255.255.255.0
        set dst 8.8.8.8 255.255.255.255
        set gateway 203.0.113.1
        set output-device "wan1"
    next
end
config vpn ssl settings
    set status enable
    set source-interface "wan1"
    set source-address "all"
    set default-portal "full-access"
end
config vpn ssl web portal
    edit "full-access"
        set tunnel-mode enable
        set web-mode enable
    next
end
config log setting
    set local-traffic-log enable
end
config some-unknown-future-stanza
    edit "x"
        set foo bar
    next
end
